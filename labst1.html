<html>
<head>
<title>Hotel Room Booking Form</title>
</head>
<body>
<table border="1" align="center"cellspacing="1" cellpadding="50">
<tr>
<td>
<h2>Hotel Room Booking Form</h2>
<form>
<label for="name">Name: </label>
<input type="text" id="name" name="name">
<br><br>

<label for="email">Email: </label>
<input type="email" id="email" name="email">
<br><br>

<label for="phone">Phone No. : </label>
<input type="tel" id="phone" name="phone">
<br><br>

<label for="checkin">Check-in Date: </label>
<input type="date" id="checkin" name="checkin">
<br><br>

<label for="checkout">Check-out Date: </label>
<input type="date" id="checkout" name="checkout">
<br><br>

<label for="seater">Choose Seater: </label>
<select id="seater">
<option value="single">Single</option>
<option value="double">Double</option>
<option value="third">Third</option>
</select>
<br><br>

<label for="guests">No. of Guests: </label>
<input type="number" id="guests" name="guests" min="1" max="10">
<br><br>

<label for="comment">Comment: </label><br>
<textarea type="text" id="comment" name="name" rows="3" cols="40"></textarea>
<br><br>

<input type="submit">
<button type="reset">Clear</button>
</form>
</td>
</tr>
</table>
</body>
</html>
